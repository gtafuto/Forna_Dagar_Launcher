name: Release Windows

# Compila la versione Windows e la pubblica su Supabase Storage (bucket
# `app-releases`), da dove la scarica il Forna Dagar Launcher.
#
# Parte SOLO quando si crea un tag `v*` (es. `v0.1.1`) oppure a mano dalla
# scheda Actions: NON a ogni push, per non consumare i minuti gratuiti di
# GitHub (una build Windows dura 10-15 minuti, contati doppio sui repo
# privati). La versione pubblicata e quella del tag, senza la `v`.
#
# Servono 4 secret nel repository (Settings > Secrets and variables > Actions):
#   SUPABASE_URL          https://<ref>.supabase.co
#   SUPABASE_ANON_KEY     chiave "anon"/publishable del progetto
#   RELEASE_CI_EMAIL      email dell'utente Supabase dedicato alle pubblicazioni
#   RELEASE_CI_PASSWORD   password di quell'utente
# L'utente puo scrivere SOLO nel bucket `app-releases` (policy dedicata): a
# differenza della chiave `service_role`, un'eventuale fuga non da accesso al
# database.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione da pubblicare (es. 0.1.1)'
        required: true

permissions:
  contents: read

env:
  APP_ID: forna_dagar_launcher
  APP_NAME: Forna Dagar Launcher
  EXE_NAME: forna_dagar_launcher.exe
  BUCKET: app-releases

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Controlla secret e versione
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          S_URL: ${{ secrets.SUPABASE_URL }}
          S_ANON: ${{ secrets.SUPABASE_ANON_KEY }}
          S_EMAIL: ${{ secrets.RELEASE_CI_EMAIL }}
          S_PASS: ${{ secrets.RELEASE_CI_PASSWORD }}
        run: |
          foreach ($name in 'S_URL','S_ANON','S_EMAIL','S_PASS') {
            if (-not (Get-Item "env:$name" -ErrorAction SilentlyContinue).Value) {
              throw "Manca il secret collegato a $name (vedi commento in cima al workflow)."
            }
          }
          if ($env:EVENT_NAME -eq 'workflow_dispatch') { $v = $env:INPUT_VERSION } else { $v = $env:REF_NAME }
          $v = $v.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.]+)?$') {
            throw "Versione non valida: '$v' (atteso es. 0.1.1 o 0.1.1-test1)."
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dipendenze
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Crea lo zip
        shell: pwsh
        run: |
          $exe = Get-ChildItem build\windows -Recurse -Filter $env:EXE_NAME |
            Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $exe) { throw "Non trovo $env:EXE_NAME nella cartella di build." }
          $zip = "$env:RUNNER_TEMP\$env:APP_ID-windows.zip"
          Compress-Archive -Path "$($exe.DirectoryName)\*" -DestinationPath $zip -Force
          $item = Get-Item $zip
          "ZIP_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP_SIZE=$($item.Length)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP_SHA256=$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Zip pronto: $([math]::Round($item.Length / 1MB, 1)) MB"

      - name: Pubblica su Supabase Storage
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CI_EMAIL: ${{ secrets.RELEASE_CI_EMAIL }}
          CI_PASSWORD: ${{ secrets.RELEASE_CI_PASSWORD }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $base = $env:SUPABASE_URL.TrimEnd('/')

          # Login dell'utente dedicato alle pubblicazioni.
          $auth = Invoke-RestMethod -Method Post -Uri "$base/auth/v1/token?grant_type=password" `
            -Headers @{ apikey = $env:SUPABASE_ANON_KEY } -ContentType 'application/json' `
            -Body (@{ email = $env:CI_EMAIL; password = $env:CI_PASSWORD } | ConvertTo-Json)
          $headers = @{ Authorization = "Bearer $($auth.access_token)"; apikey = $env:SUPABASE_ANON_KEY; 'x-upsert' = 'true' }

          # 1) Lo zip, in una cartella per versione (le vecchie restano
          #    disponibili per il ripristino dal launcher).
          $zipKey = "$env:APP_ID/$env:VERSION/$env:APP_ID-windows.zip"
          Invoke-RestMethod -Method Post -Uri "$base/storage/v1/object/$env:BUCKET/$zipKey" `
            -Headers $headers -ContentType 'application/zip' -InFile $env:ZIP_PATH | Out-Null

          # 2) Il manifest `latest.json`, per ultimo: il launcher vede la
          #    nuova versione solo quando lo zip e gia interamente caricato.
          $publicBase = "$base/storage/v1/object/public/$env:BUCKET"
          $manifest = [ordered]@{
            id           = $env:APP_ID
            name         = $env:APP_NAME
            version      = $env:VERSION
            exe          = $env:EXE_NAME
            url          = "$publicBase/$zipKey"
            sha256       = $env:ZIP_SHA256
            size         = [int64]$env:ZIP_SIZE
            commit       = $env:COMMIT_SHA
            published_at = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          } | ConvertTo-Json
          $manifestFile = "$env:RUNNER_TEMP\latest.json"
          [System.IO.File]::WriteAllText($manifestFile, $manifest, (New-Object System.Text.UTF8Encoding($false)))
          $manifestHeaders = $headers.Clone()
          $manifestHeaders['cache-control'] = 'no-cache'
          Invoke-RestMethod -Method Post -Uri "$base/storage/v1/object/$env:BUCKET/$env:APP_ID/latest.json" `
            -Headers $manifestHeaders -ContentType 'application/json' -InFile $manifestFile | Out-Null

          # 3) Verifica: rilegge il manifest dall'URL pubblico, come fara il launcher.
          $check = Invoke-RestMethod -Uri "$publicBase/$env:APP_ID/latest.json?t=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())"
          if ($check.version -ne $env:VERSION) {
            throw "Verifica fallita: il manifest pubblico dice '$($check.version)', atteso '$env:VERSION'."
          }
          "### $env:APP_NAME $env:VERSION pubblicato`n- Zip: $($check.url)`n- SHA-256: ``$($check.sha256)``" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
