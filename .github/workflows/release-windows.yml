name: Release Windows

# Compila la versione Windows e la pubblica come Release di GitHub di questo
# repository, da dove la scarica il Forna Dagar Launcher (con l'accesso
# GitHub di ciascun utente: i repository sono privati).
#
# Parte SOLO quando si crea un tag `v*` (es. `v0.1.1`) oppure a mano dalla
# scheda Actions: NON a ogni push, per non consumare i minuti gratuiti di
# GitHub (una build Windows dura 10-15 minuti, contati doppio sui repo
# privati). La versione pubblicata e quella del tag, senza la `v`.
#
# Non servono secret: usa il token automatico di GitHub Actions
# (`permissions: contents: write`, solo per questo repository).
#
# La Release contiene due allegati:
#   <APP_ID>-windows.zip   la cartella di build di Windows
#   manifest.json          versione, eseguibile, SHA-256 e dimensione dello zip

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione da pubblicare (es. 0.1.1). Crea il tag v<versione> sul commit selezionato.'
        required: true

permissions:
  contents: write

env:
  APP_ID: forna_dagar_launcher
  APP_NAME: Forna Dagar Launcher
  EXE_NAME: forna_dagar_launcher.exe

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Controlla la versione
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') { $v = $env:INPUT_VERSION } else { $v = $env:REF_NAME }
          $v = $v.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.]+)?$') {
            throw "Versione non valida: '$v' (atteso es. 0.1.1 o 0.1.1-test1)."
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dipendenze
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Crea lo zip e il manifest
        shell: pwsh
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $exe = Get-ChildItem build\windows -Recurse -Filter $env:EXE_NAME |
            Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $exe) { throw "Non trovo $env:EXE_NAME nella cartella di build." }

          $zipName = "$env:APP_ID-windows.zip"
          $zip = Join-Path $env:RUNNER_TEMP $zipName
          Compress-Archive -Path "$($exe.DirectoryName)\*" -DestinationPath $zip -Force
          $item = Get-Item $zip
          Write-Host "Zip pronto: $([math]::Round($item.Length / 1MB, 1)) MB"

          $manifest = [ordered]@{
            id      = $env:APP_ID
            name    = $env:APP_NAME
            version = $env:VERSION
            exe     = $env:EXE_NAME
            asset   = $zipName
            sha256  = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            size    = [int64]$item.Length
            commit  = $env:COMMIT_SHA
          } | ConvertTo-Json
          $manifestFile = Join-Path $env:RUNNER_TEMP 'manifest.json'
          [System.IO.File]::WriteAllText($manifestFile, $manifest, (New-Object System.Text.UTF8Encoding($false)))

          "ZIP_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MANIFEST_PATH=$manifestFile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Pubblica la Release su GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $tag = "v$env:VERSION"
          $notes = "Build automatica di $env:APP_NAME $env:VERSION (commit $($env:COMMIT_SHA.Substring(0, 7)))."
          gh release create $tag $env:ZIP_PATH $env:MANIFEST_PATH --title "$env:APP_NAME $env:VERSION" --notes $notes --target $env:COMMIT_SHA
          if ($LASTEXITCODE -ne 0) { throw "Creazione della Release fallita." }

          # Verifica: la Release deve contenere i due allegati attesi.
          $names = gh release view $tag --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw "Non riesco a rileggere la Release appena creata." }
          foreach ($expected in "$env:APP_ID-windows.zip", 'manifest.json') {
            if ($names -notcontains $expected) { throw "Manca l'allegato $expected nella Release." }
          }
          "### $env:APP_NAME $env:VERSION pubblicato`n- Release: $tag`n- Allegati: $($names -join ', ')" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
